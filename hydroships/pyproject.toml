[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroships"
version = "0.1.0"
description = "Jetson companion dashboard for ArduSub"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pymavlink>=2.4.49,<3", "pyserial==3.5", "psutil>=6,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
