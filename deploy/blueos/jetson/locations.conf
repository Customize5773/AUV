absolute_redirect off;

location = /system-information/platform {
    proxy_pass http://127.0.0.1:9140/platform;
}
location = /system-information/system/temperature {
    proxy_pass http://127.0.0.1:9140/temperature;
}
location = /jetson-bench/health {
    proxy_pass http://127.0.0.1:9140/health;
}
# Known Vue routes should return HTTP 200 on a direct visit/reload.
location ~ ^/(vehicle|tools)/ {
    root /home/pi/frontend;
    try_files $uri /index.html;
}
